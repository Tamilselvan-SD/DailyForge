<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DailyForge</title>
  <meta name="description" content="Track your daily routine and build a streak." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="app">
    <header class="top">
      <div>
        <h1 id="greeting">Hello</h1>
        <p id="today" class="muted"></p>
      </div>
      <div class="top-right">
        <div class="streak" id="streakBadge" title="Current streak">
          <span class="flame" aria-hidden="true">🔥</span>
          <span><b id="streakNum">0</b> day streak</span>
        </div>
        <button class="icon-btn" id="themeBtn" aria-label="Toggle dark mode">🌙</button>
      </div>
    </header>

    <section class="stats">
      <div class="card ring-card">
        <svg viewBox="0 0 48 48" width="52" height="52" aria-hidden="true">
          <circle class="ring-bg" cx="24" cy="24" r="19" />
          <circle class="ring-fg" id="ring" cx="24" cy="24" r="19" />
        </svg>
        <div><b class="big" id="doneCount">0/0</b><span class="muted small">Done today</span></div>
      </div>
      <div class="card"><span class="muted small">Best streak</span><b class="big" id="bestNum">0 days</b></div>
      <div class="card"><span class="muted small">Active days</span><b class="big" id="activeDays">0</b></div>
    </section>

    <p class="motivation" id="motivation"></p>

    <form class="add" id="addForm" autocomplete="off">
      <input id="taskInput" type="text" maxlength="80" placeholder="Add a task to your routine" aria-label="New task" />
      <button type="submit" class="btn">Add</button>
    </form>

    <nav class="tabs" id="tabs" role="tablist">
      <button class="tab active" data-tab="active" role="tab">Active <span id="cActive">0</span></button>
      <button class="tab" data-tab="completed" role="tab">Completed <span id="cCompleted">0</span></button>
      <button class="tab" data-tab="all" role="tab">All <span id="cAll">0</span></button>
      <span class="tab-bar" id="tabBar"></span>
    </nav>

    <ul class="list" id="list"></ul>
    <div class="empty" id="empty" hidden></div>

    <section class="week">
      <p class="muted small">Last 7 days</p>
      <div class="week-row" id="week"></div>
    </section>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="js/app.js"></script>
</body>
</html>
